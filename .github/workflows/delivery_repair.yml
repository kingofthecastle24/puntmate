name: PuntMate Delivery Repair Dry Run
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: puntmate-social-pipeline
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow requests playwright
      - run: python -m playwright install chromium --with-deps
      - name: Materialize reviewed draft files (all live flags off)
        run: |
          python - <<'PYFILES'
          import base64,json
          from pathlib import Path
          files={'scripts/public_delivery.py': '', 'scripts/render_public_record.py': '', 'tests/test_public_delivery.py': '', 'config/public_delivery.json': '', 'data/results/picks_ledger.json': '', '.github/workflows/public_delivery.yml': '', 'scripts/settle_public_ledger.py': '', '.github/workflows/check_results.yml': ''}
          for name,value in files.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(value))
          assert not any(json.loads(Path('config/public_delivery.json').read_text()).get(k) for k in ('results_enabled','recap_enabled','news_enabled'))
          Path('data/results/recap_preview.json').write_text(json.dumps({'start':'2026-11-02','end':'2026-11-08'}))
          PYFILES
      - name: Test delivery safety and render current-week proof without sending
        run: |
          python -m unittest discover -s tests -p test_public_delivery.py
          python scripts/public_delivery.py results
          python scripts/public_delivery.py recap --payload data/results/recap_preview.json
      - name: Save disabled draft on review branch (never enable or publish)
        run: |
          git switch -c fix/delivery-reviewed-v3
          git add scripts/public_delivery.py scripts/render_public_record.py scripts/settle_public_ledger.py tests/test_public_delivery.py config/public_delivery.json data/results/picks_ledger.json data/results/recap_preview.json
          git config user.name 'puntmate-bot'
          git config user.email 'puntmate-bot@users.noreply.github.com'
          git commit -m 'Build disabled source-ledger delivery with native-template proof'
          git push origin HEAD:fix/delivery-reviewed-v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-repair-proof
          path: data/public_delivery/
