name: Install approved carousel and result-copy defaults
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt
    - run: "python - <<'PYFILES'\nimport json,base64\nfrom pathlib import Path\nfiles=json.loads('{\"\
        brand/Templates/PuntMate Bet Post - Betslip Night.dc.html\": \"\"\
        , \"brand/Templates/PuntMate Bet Post - Matchday Print.dc.html\": \"\"\
        , \"brand/Templates/PuntMate Bet Post - Multi.dc.html\": \"\"\
        , \"scripts/render_roundup.py\": \"\"\
        , \"scripts/result_roundup.py\": \"\"\
        , \"scripts/design_review_gate.py\": \"\"\
        , \"DESIGN_REVIEW.md\": \"\"\
        }')\nfor name,data in files.items():\n p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(data))\n\
        PYFILES\npython -m py_compile scripts/result_roundup.py scripts/render_roundup.py\
        \ scripts/design_review_gate.py\npython -m unittest discover -s tests -p 'test_result_roundup.py'\n\
        git config user.name 'PuntMate maintenance'\ngit config user.email 'actions@users.noreply.github.com'\n\
        git add brand/Templates scripts/render_roundup.py scripts/result_roundup.py\
        \ scripts/design_review_gate.py DESIGN_REVIEW.md\ngit commit -m 'Respect swipe-right\
        \ carousel copy and source-backed loss context [skip ci]'\ngit push origin\
        \ HEAD:main"
