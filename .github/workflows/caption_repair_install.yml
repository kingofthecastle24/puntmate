name: Install reviewed-roundup preparation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - run: echo "One-time caption repair installed. No further writes."
      - if: ${{ false }}
        uses: actions/checkout@v4
        with:
          ref: main
      - if: ${{ false }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: ${{ false }}
        run: pip install -r requirements.txt
      - name: Install preparation code only, no publishing credentials
        if: ${{ false }}
        run: |
          python - <<'PYFILES'
          import json,base64
          from pathlib import Path
          files=json.loads('{"scripts/result_roundup.py": "", "scripts/render_roundup.py": "", "scripts/public_delivery.py": "", "scripts/design_review_gate.py": "", "scripts/publish_pick.py": "", "scripts/generate_pick.py": "", "scripts/copy_validator.py": "", "DESIGN_REVIEW.md": "", "tests/test_result_roundup.py": "", "tests/test_caption_send_gate.py": ""}')
          for name,data in files.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(data))
          PYFILES
          python -m unittest discover -s tests -p test_result_roundup.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p test_caption_send_gate.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p "*copy*py"
          git config user.name 'PuntMate Bot'
          git config user.email 'puntmatenz@gmail.com'
          git add scripts/result_roundup.py scripts/render_roundup.py scripts/public_delivery.py scripts/design_review_gate.py scripts/publish_pick.py scripts/generate_pick.py scripts/copy_validator.py DESIGN_REVIEW.md tests/test_result_roundup.py tests/test_caption_send_gate.py
          git commit -m 'Revalidate frozen captions and require explicit caption review [skip ci]'
          git push
