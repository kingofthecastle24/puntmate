name: PuntMate exact reviewed no-bet 7 Nov
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: puntmate-social-pipeline
  cancel-in-progress: false
jobs:
  no_bet:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install requests
    - name: Materialize exact inspected graphic, bind review, deliver only approved destinations
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        IG_USER_ID: ${{ secrets.IG_USER_ID }}
        META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      run: "git config user.name 'PuntMate maintenance'\ngit config user.email 'actions@users.noreply.github.com'\npython - <<'PYDONE'\nimport base64,hashlib,json,os,subprocess\nfrom pathlib import Path\nfrom datetime import datetime,timezone\nfrom design_review_gate import snapshot,verify,CHECKS\nfrom copy_validator import validate_text\nroot=Path.cwd(); run=os.environ['GITHUB_RUN_ID'];job=os.environ['GITHUB_JOB']\nassert datetime.now(timezone.utc) < datetime.fromisoformat('2026-11-06T22:30:00+00:00'), 'Review window expired'\np=root/'data/cards/no-bet-2026-11-07.png'\np.parent.mkdir(parents=True,exist_ok=True)\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='26e68bae228a778e2733dace2ba2a10d50440a61e6f35d7ef7153aaaf2800e60'\np.write_bytes(data)\ncaption=\"No recommended bet today. We're sitting this one out rather than forcing a pick.\"\nvalidate_text(caption,risk='NO_BET',public=True)\nreceipt=root/'data/design_reviews'/(run+'-'+job+'.json');receipt.parent.mkdir(parents=True,exist_ok=True)\nreceipt.write_text(json.dumps({'run_id':run,'job':job,'snapshot_sha256':snapshot(root),'decision':'PASS','reviewer':'parent final visual inspection 2026-11-07T09:45:10+13:00','reviewed_at':'2026-11-07T09:45:10+13:00','style_reference':'current pink house Story; parent inspected exact no-bet proof','outgoing_assets':{str(p.relative_to(root)):'26e68bae228a778e2733dace2ba2a10d50440a61e6f35d7ef7153aaaf2800e60'},'destinations':['telegram','instagram_story'],'checks':{k:True for k in CHECKS}},indent=2))\nverify(root,run,job)\nfrom public_delivery import load,save,STATE\nimport requests\nkey='no-bet-2026-11-07';state=load(STATE,{'items':{}});item=state.setdefault('items',{}).setdefault(key,{})\ndef persist():\n save(STATE,state)\n subprocess.run(['git','add',str(STATE),str(p)],check=True)\n subprocess.run(['bash','scripts/git_push_retry.sh','chore: exact no-bet delivery state [skip ci]'],check=True)\nfor dest in ['telegram','instagram_story']:\n prior=item.get(dest,{})\n if prior.get('status')=='sent':continue\n if prior.get('status')=='attempting':raise RuntimeError('Ambiguous prior attempt; inspect before retry')\n item[dest]={'status':'attempting','at':datetime.now(timezone.utc).isoformat()};persist()\n if dest=='telegram':\n  with p.open('rb') as f:\n   r=requests.post('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/sendPhoto',data={'chat_id':os.environ['TELEGRAM_CHANNEL_ID'],'caption':caption},files={'photo':f},timeout=60).json()\n  assert r.get('ok'),'Telegram rejected delivery'\n  got={'message_id':r['result']['message_id']}\n else:\n  url='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/main/'+str(p.relative_to(root))\n  got_image=requests.get(url,timeout=30);got_image.raise_for_status()\n  assert hashlib.sha256(got_image.content).hexdigest()=='26e68bae228a778e2733dace2ba2a10d50440a61e6f35d7ef7153aaaf2800e60'\n  from post_instagram_story import post_story_to_instagram\n  mid=post_story_to_instagram(url);assert mid,'Story failed or ambiguous'\n  got={'media_id':mid}\n item[dest]={'status':'sent','receipt':got,'at':datetime.now(timezone.utc).isoformat()};persist()\nprint(json.dumps(item))\nPYDONE"
    - name: Persist receipts even on failure
      if: always()
      run: 'git add data/design_reviews/ data/state/public_delivery.json data/cards/no-bet-2026-11-07.png

        bash scripts/git_push_retry.sh "chore: reviewed no-bet delivery receipts [skip ci]" --soft'
