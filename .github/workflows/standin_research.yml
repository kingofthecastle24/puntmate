name: PuntMate Stand-in Research
run-name: Stand-in ${{ inputs.action }} - ${{ inputs.pick_id || 'new research pick' }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a frozen package, or publish an inspected package
        type: choice
        options: [prepare, publish, prepare-multi, prepare-story, prepare-details, publish-multi, diagnose, prepare-recap, publish-recap]
        default: prepare
        required: true
      pick_json:
        description: Real researched pick JSON (prepare only; no secrets)
        type: string
        required: false
      pick_id:
        description: Exact frozen package ID (publish only)
        type: string
        required: false
      recap_json:
        description: Weekly recap payload JSON (prepare-recap only; no secrets)
        type: string
        required: false
      meta_ready:
        description: Meta token repaired and ready for Story publishing
        type: boolean
        default: false
      facebook_ready:
        description: Existing Facebook token verified for approved Story retry only
        type: boolean
        default: false
      facebook_approved:
        description: Final Facebook Story photo reviewed and approved by Micah
        type: boolean
        default: false
      dry_run:
        description: Simulate publishing without sending any posts
        type: boolean
        default: true
concurrency:
  group: puntmate-social-pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  standin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      ACTION: ${{ inputs.action }}
      PICK_JSON: ${{ inputs.pick_json }}
      RECAP_JSON: ${{ inputs.recap_json }}
      PICK_ID: ${{ inputs.pick_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      META_READY: ${{ inputs.meta_ready }}
      FACEBOOK_READY: ${{ inputs.facebook_ready }}
      FACEBOOK_APPROVED: ${{ inputs.facebook_approved }}
      AUTO_PUBLISH: 'true'
      RESEND_FAILED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow playwright
      - if: inputs.action == 'prepare' || inputs.action == 'prepare-multi'
        run: playwright install --with-deps chromium
      - name: Validate and prepare research-only frozen package
        if: inputs.action == 'prepare'
        run: |
          python - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import render_brand_templates as renderer
          from build_review_package import build_telegram_text, build_instagram_caption
          from copy_validator import validate_post
          from manifest import build_manifest, write_manifest
          from workflow_state import transition, GENERATED, PREVIEW_READY, AWAITING_APPROVAL
          now = datetime.now(timezone.utc)
          local = now.astimezone(ZoneInfo('Pacific/Auckland'))
          assert local.date().isoformat() < '2026-11-01', 'Stand-in authorization window ended'
          p = json.loads(os.environ['PICK_JSON'])
          required = ['match','sport','sport_label','market','selection','odds','kickoff','final_explanation','research_sources','odds_source_url','research_checked_at']
          assert all(p.get(k) for k in required), 'Missing required pick evidence'
          assert p.get('source_type') == 'research_based', 'Research source type required'
          assert not any(p.get(k) for k in ('synthetic','test','is_test','force_test_pick')), 'No synthetic picks'
          kickoff = datetime.fromisoformat(p['kickoff'].replace('Z','+00:00'))
          checked = datetime.fromisoformat(p['research_checked_at'].replace('Z','+00:00'))
          assert 0 < (kickoff-now).total_seconds() <= 86400, 'Fixture must be in next 24h'
          assert 0 <= (now-checked).total_seconds() < 7200, 'Research is stale'
          assert 1 < float(p['odds']) <= 2.2, 'Conservative odds required'
          assert len(p['research_sources']) >= 2 and all(s.startswith('https://') for s in p['research_sources'])
          assert p['odds_source_url'].startswith('https://')
          p.update(has_pick=True, bet_type='INVESTOR_BET', bet_type_label='Investor Bet', risk='STANDARD_PICK', confidence='High', confidence_label='High')
          p['bet_type_reason'] = p['final_explanation']
          date = local.date().isoformat()
          pick_id = date + '_research_' + renderer.slugify(p['match'])
          revision = p.get('revision', 1)
          assert isinstance(revision, int) and 1 <= revision <= 9
          if revision > 1:
              pick_id += '_v' + str(revision)
          assert not Path('data/review',pick_id).exists(), 'Frozen package already exists; inspect it or use its exact ID'
          def kickoff_display(iso):
              dt = datetime.fromisoformat(iso.replace('Z','+00:00')).astimezone(ZoneInfo('Pacific/Auckland'))
              return dt.strftime('%a %d %b').upper(), dt.strftime('%a %d %b, %-I:%M%p').lower() + ' NZDT'
          renderer.kickoff_display = kickoff_display
          original_build_props = renderer.build_props
          def standin_props(pick, handle='@puntmatenz'):
              props = original_build_props(pick, handle)
              # Template appends RISK to this prop; confidence remains in its own chip.
              props['confidenceLabel'] = 'LOW'
              return props
          renderer.build_props = standin_props
          result = renderer.render_pick(p, date_str=date)
          assert result['ok'], result
          p['render_warnings'] = result.get('warnings', [])
          review = Path('data/review',pick_id)
          review.mkdir(parents=True)
          for key, src in result['files'].items():
              shutil.copyfile(src,review/(key+'.png'))
          telegram, instagram = build_telegram_text(p), build_instagram_caption(p)
          validate_post({'risk':p['risk'],'bet_type':p['bet_type'],'classification':p['risk'],'selection':p['selection']},telegram,instagram)
          (review/'telegram-post.txt').write_text(telegram)
          (review/'instagram-caption.txt').write_text(instagram)
          # Public graphics stay in normal PuntMate style; provenance stays in metadata.
          meta = dict(p, pick_id=pick_id, post_date=date, generated_at=now.isoformat(), intended_platforms=['telegram','instagram_feed','instagram_story'], source_type='research_based', stake_guidance_nzd=10, workflow_state='AWAITING_APPROVAL')
          base = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/main/'
          # Normalize any absolute renderer paths before constructing public URLs.
          meta['carousel_urls'] = [base+str(Path(result['files'][k]).resolve().relative_to(Path.cwd())) for k in ('cover','tip','breakdown')]
          meta['story_url'] = base+str(Path(result['files']['story']).resolve().relative_to(Path.cwd()))
          (review/'post-metadata.json').write_text(json.dumps(meta,indent=2))
          names = [f.name for f in review.iterdir() if f.is_file()]
          write_manifest(build_manifest(str(review),names,extra={'pick_id':pick_id,'created_at':now.isoformat()}),str(review/'manifest.json'))
          for state in (GENERATED,PREVIEW_READY,AWAITING_APPROVAL):
              transition(os.getcwd(),pick_id,state,note='Research-based stand-in; visual review before live dispatch')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Prepared research-based package: '+pick_id+'\n\nInspect all four PNGs and captions before dispatching publish.\n')
          PY
      - name: Prepare weekend research multi
        if: inputs.action == 'prepare-multi'
        run: |
          python - <<'PYMULTI'
          import json, os, shutil
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from decimal import Decimal
          from PIL import Image, ImageDraw, ImageFont
          import render_brand_templates as renderer
          from copy_validator import validate_text
          from manifest import build_manifest, write_manifest
          from workflow_state import transition, GENERATED, PREVIEW_READY, AWAITING_APPROVAL
          now = datetime.now(timezone.utc)
          today = now.astimezone(ZoneInfo('Pacific/Auckland')).date().isoformat()
          assert today < '2026-11-01', 'Stand-in authorization window ended'
          p = json.loads(os.environ['PICK_JSON'])
          assert p.get('kind') == 'research_multi' and p.get('source_type') == 'research_based'
          assert not any(p.get(k) for k in ('synthetic','test','is_test','force_test_pick')), 'No synthetic picks'
          legs = p['legs']
          assert 2 <= len(legs) <= 4, 'Multi needs 2-4 legs'
          checked = datetime.fromisoformat(p['research_checked_at'].replace('Z','+00:00'))
          assert 0 <= (now-checked).total_seconds() < 7200
          for leg in legs:
              assert all(leg.get(k) for k in ('match','selection','odds','kickoff')), 'Leg missing fields'
              dt = datetime.fromisoformat(leg['kickoff'].replace('Z','+00:00'))
              assert 0 < (dt-now).total_seconds() < 7*86400
              assert 1 < float(leg['odds']) < 3
          combined = Decimal('1')
          for leg in legs: combined *= Decimal(str(leg['odds']))
          pid = today + '_research_Weekend_Multi_full'
          d = Path('data/review',pid)
          assert not d.exists(), 'Frozen multi already exists; inspect it or use its exact ID'
          d.mkdir(parents=True)
          original = renderer.build_multi_props
          def props(ls,tier,handle='@puntmatenz'):
              x = original(ls,tier,handle)
              x.update(analysis=p['analysis'],combinedOdds='~'+format(combined,'.2f'),stake='$10',stakeReturn='All '+str(len(legs))+' legs must win',multiType='Weekend Multi',coverKicker='WEEKEND MULTI',riskTagline=p.get('risk_tagline','All legs must win - Indicative public odds'))
              return x
          renderer.build_multi_props = props
          result = renderer.render_multi({'match':'Weekend Multi'},'punter',legs,date_str=today)
          assert result['ok'], result
          for key,srcf in result['files'].items():
              shutil.copyfile(srcf,d/('tip.png' if key=='legs' else key+'.png'))
          im=Image.new('RGB',(1080,1920),'#0b120f'); draw=ImageDraw.Draw(im)
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def text(y,s,size=32,color='#eaf7ef',b=False):
              f=ImageFont.truetype(bold if b else font,size);draw.text((80,y),s,font=f,fill=color)
          logo=Image.open('brand/Logo/puntmate-icon-badge.png').convert('RGBA').resize((112,112),Image.Resampling.LANCZOS)
          im.paste(logo,(70,190),logo)
          draw.text((205,218),'PUNTMATE NZ',font=ImageFont.truetype(bold,44),fill='#24df7a')
          text(315,'WEEKEND MULTI',37,b=True)
          legsimg=Image.open(d/'tip.png').convert('RGB');legsimg.thumbnail((1080,1300));im.paste(legsimg,((1080-legsimg.width)//2,360))
          text(1695,p['story_line1'],27)
          text(1734,p['story_line2'],27)
          text(1785,'Indicative public odds, not TAB. Odds may change.',23,'#8fa69a')
          text(1820,'All '+str(len(legs))+' must win. 18+.',23,'#8fa69a')
          im.save(d/'story.png')
          im2=Image.open(d/'story.png').convert('RGB');draw2=ImageDraw.Draw(im2);draw2.rectangle((0,360,1080,1680),fill='#0b120f')
          ximg=Image.open(d/'breakdown.png').convert('RGB');ximg.thumbnail((1080,1300));im2.paste(ximg,((1080-ximg.width)//2,360));im2.save(d/'story-breakdown.png')
          text = p['caption']
          validate_text(text,risk='STANDARD_PICK',bet_type='PUNTER_BET',public=True)
          (d/'telegram-post.txt').write_text(text)
          (d/'instagram-caption.txt').write_text(text)
          base='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/main/'+str(d)+'/'
          meta=dict(p,has_pick=True,pick_id=pid,post_date=today,generated_at=now.isoformat(),kickoff=legs[0]['kickoff'],match='Weekend Multi',selection=' + '.join(l['selection'] for l in legs),odds=float(combined),market='Match winner multi',bet_type='PUNTER_BET',risk='STANDARD_PICK',confidence='Medium',confidence_label='Medium',carousel_urls=[base+'cover.png',base+'tip.png',base+'breakdown.png'],story_url=base+'story.png',story_urls=[base+'story.png',base+'story-breakdown.png'],intended_platforms=['telegram','instagram_story'],render_warnings=result.get('warnings',[]),stake_guidance_nzd=10)
          (d/'post-metadata.json').write_text(json.dumps(meta,indent=2))
          write_manifest(build_manifest(str(d),[f.name for f in d.iterdir() if f.name!='manifest.json'],extra={'pick_id':pid,'created_at':now.isoformat()}),str(d/'manifest.json'))
          for state in (GENERATED,PREVIEW_READY,AWAITING_APPROVAL): transition(os.getcwd(),pid,state,note='Weekend research multi; render review required')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Prepared '+pid+'; inspect all PNGs before live publish.')
          PYMULTI
      - name: Prepare story-only multi revision
        if: inputs.action == 'prepare-story'
        run: |
          python - <<'PYSTORY'
          import json, os, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from manifest import build_manifest, write_manifest
          from workflow_state import transition, GENERATED, PREVIEW_READY, AWAITING_APPROVAL
          from datetime import datetime, timezone
          pid='2026-10-16_research_RLWC_Weekend_Multi_story'
          src=Path('data/review/2026-10-16_research_RLWC_Weekend_Multi')
          d=Path('data/review',pid)
          assert not d.exists()
          shutil.copytree(src,d)
          im=Image.new('RGB',(1080,1920),'#0b120f'); draw=ImageDraw.Draw(im)
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def text(y,s,size=32,color='#eaf7ef',b=False):
              f=ImageFont.truetype(bold if b else font,size);draw.text((80,y),s,font=f,fill=color)
          logo=Image.open('brand/Logo/puntmate-icon-badge.png').convert('RGBA').resize((112,112),Image.Resampling.LANCZOS)
          im.paste(logo,(70,190),logo)
          draw.text((205,218),'PUNTMATE NZ',font=ImageFont.truetype(bold,44),fill='#24df7a')
          text(315,'WORLD CUP WEEKEND MULTI',37,b=True)
          legs=Image.open(d/'tip.png').convert('RGB');legs.thumbnail((1080,1300));im.paste(legs,((1080-legs.width)//2,360))
          text(1695,'PNG: Sat 5:25pm   Tonga: Sat 10:05pm',27)
          text(1734,'Fiji: Sun 6:05pm  |  NZDT  |  17-18 Oct',27)
          text(1785,'Indicative PandaBet odds, not TAB. Odds may change.',23,'#8fa69a')
          text(1820,'All 3 must win. Tonga is the danger leg. 18+.',23,'#8fa69a')
          im.save(d/'story.png')
          shutil.copyfile(d/'story.png',d/'tip.png')
          m=json.loads((d/'post-metadata.json').read_text())
          m.update(pick_id=pid,intended_platforms=['telegram','instagram_story','facebook_story'],story_url='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/main/'+str(d/'story.png'))
          (d/'post-metadata.json').write_text(json.dumps(m,indent=2))
          write_manifest(build_manifest(str(d),[f.name for f in d.iterdir() if f.name!='manifest.json'],extra={'pick_id':pid,'created_at':datetime.now(timezone.utc).isoformat()}),str(d/'manifest.json'))
          for state in (GENERATED,PREVIEW_READY,AWAITING_APPROVAL):transition(os.getcwd(),pid,state,note='Story-only correction requested by Micah; inspect actual story PNG')
          PYSTORY
      - name: Include the requested breakdown and description
        if: inputs.action == 'prepare-details'
        run: |
          python - <<'PYDETAILS'
          import json, os, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw
          from manifest import build_manifest, write_manifest
          from workflow_state import transition, GENERATED, PREVIEW_READY, AWAITING_APPROVAL
          from datetime import datetime, timezone
          pid='2026-10-16_research_RLWC_Weekend_Multi_full'
          d=Path('data/review',pid)
          assert not d.exists()
          shutil.copytree('data/review/2026-10-16_research_RLWC_Weekend_Multi_story',d)
          im=Image.open(d/'story.png').convert('RGB');draw=ImageDraw.Draw(im);draw.rectangle((0,360,1080,1680),fill='#0b120f')
          x=Image.open(d/'breakdown.png').convert('RGB');x.thumbnail((1080,1300));im.paste(x,((1080-x.width)//2,360));im.save(d/'story-breakdown.png')
          m=json.loads((d/'post-metadata.json').read_text())
          base='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/main/'+str(d)+'/'
          m.update(pick_id=pid,story_url=base+'story.png',story_urls=[base+'story.png',base+'story-breakdown.png'])
          (d/'post-metadata.json').write_text(json.dumps(m,indent=2))
          write_manifest(build_manifest(str(d),[f.name for f in d.iterdir() if f.name!='manifest.json'],extra={'pick_id':pid,'created_at':datetime.now(timezone.utc).isoformat()}),str(d/'manifest.json'))
          for state in (GENERATED,PREVIEW_READY,AWAITING_APPROVAL):transition(os.getcwd(),pid,state,note='Micah approved corrected photo and requested breakdown plus description')
          PYDETAILS
      - name: Render weekly recap package
        if: inputs.action == 'prepare-recap'
        run: |
          python - <<'PYRECAP'
          import json, os, re, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from PIL import Image, ImageDraw, ImageFont
          from manifest import build_manifest, write_manifest
          now = datetime.now(timezone.utc)
          local = now.astimezone(ZoneInfo('Pacific/Auckland'))
          assert local.date().isoformat() < '2026-11-01', 'Stand-in authorization window ended'
          r = json.loads(os.environ['RECAP_JSON'])
          rows = r['rows']; wins = int(r['wins']); losses = int(r['losses'])
          assert wins + losses == len(rows) and wins >= 0 and losses >= 0, 'Row count mismatch'
          for row in rows:
              assert all(k in row for k in ('day','text','score','win')), 'Missing row field'
              assert isinstance(row['win'], bool)
          assert r.get('evidence_urls'), 'Recap evidence URLs required'
          assert r.get('week_label') and r.get('pending_note') is not None and r.get('telegram_caption'), 'Missing recap fields'
          pid = local.date().isoformat() + '_research_Weekly_Recap'
          d = Path('data/review', pid)
          assert not d.exists(), 'Recap package already frozen for today'
          d.mkdir(parents=True)
          FD = Path('/tmp/recap_fonts'); FD.mkdir(exist_ok=True)
          BASE = 'https://raw.githubusercontent.com/google/fonts/main/ofl/'
          for url, name in ((BASE+'archivoblack/ArchivoBlack-Regular.ttf','Archivo-Black.ttf'),
                            (BASE+'spacemono/SpaceMono-Regular.ttf','SpaceMono-Regular.ttf'),
                            (BASE+'spacemono/SpaceMono-Bold.ttf','SpaceMono-Bold.ttf'),
                            (BASE+'spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf','SpaceGrotesk-var.ttf')):
              urllib.request.urlretrieve(url, FD/name)
          W, H, S = 1080, 1920, 2
          def sp(v): return int(round(v*S))
          INK,SURFACE,GREEN,PAPER,MUTED,DIMMER,WARN = '#0B0F0D','#111815','#35E07E','#EAF7EF','#6B7A72','#3A4A40','#C96A5B'
          def archivo(sz): return ImageFont.truetype(str(FD/'Archivo-Black.ttf'), sp(sz))
          def grotesk(sz, w):
              f = ImageFont.truetype(str(FD/'SpaceGrotesk-var.ttf'), sp(sz)); f.set_variation_by_axes([w]); return f
          def mono_b(sz): return ImageFont.truetype(str(FD/'SpaceMono-Bold.ttf'), sp(sz))
          def mono_r(sz): return ImageFont.truetype(str(FD/'SpaceMono-Regular.ttf'), sp(sz))
          img = Image.new('RGB', (W*S, H*S), INK)
          dr = ImageDraw.Draw(img)
          for x in range(0, W+1, 60): dr.line([(sp(x),0),(sp(x),sp(H))], fill='#131A16', width=1)
          for y in range(0, H+1, 60): dr.line([(0,sp(y)),(sp(W),sp(y))], fill='#131A16', width=1)
          pad = 64
          lockup = Image.open('brand/Logo/puntmate-lockup.png').convert('RGBA')
          lw = sp(300); lh = int(lw*lockup.size[1]/lockup.size[0])
          lockup = lockup.resize((lw,lh), Image.LANCZOS)
          img.paste(lockup, (sp(pad), sp(pad-10)), lockup)
          tag = r['week_label']
          tf = mono_b(15); tw = dr.textlength(tag, font=tf)
          pw, ph = sp(tw)+sp(36), sp(40)
          px = sp(W-pad)-pw
          dr.rounded_rectangle([px, sp(pad+6), px+pw, sp(pad+6)+ph], radius=sp(20), outline=GREEN, width=sp(2))
          dr.text((px+sp(18), sp(pad+14)), tag, font=tf, fill=GREEN)
          dr.text((sp(pad), sp(200)), '// WEEK IN REVIEW', font=mono_b(22), fill=GREEN)
          dr.text((sp(pad-4), sp(248)), f'{wins}W - {losses}L', font=archivo(110), fill=PAPER)
          dr.text((sp(pad), sp(400)), 'Every published pick, every result.\nPending shown separately - nothing hidden.', font=grotesk(26,500), fill=MUTED, spacing=sp(8))
          y = 530
          dr.text((sp(pad), sp(y)), 'SETTLED SINGLES', font=mono_b(16), fill=MUTED)
          y += 44
          x2 = W - pad
          for row in rows:
              dr.rounded_rectangle([sp(pad), sp(y), sp(x2), sp(y+116)], radius=sp(16), fill=SURFACE, outline=DIMMER, width=sp(1.2))
              dr.text((sp(pad+28), sp(y+24)), row['day'], font=mono_b(15), fill=MUTED)
              dr.text((sp(pad+28), sp(y+62)), row['text'], font=grotesk(24,700), fill=PAPER)
              dr.text((sp(x2-28), sp(y+26)), row['score'], font=mono_r(16), fill=MUTED, anchor='ra')
              dr.text((sp(x2-28), sp(y+64)), 'W' if row['win'] else 'L', font=archivo(30), fill=GREEN if row['win'] else WARN, anchor='ra')
              y += 132
          y += 16
          dr.text((sp(pad), sp(y)), 'PENDING', font=mono_b(16), fill=MUTED)
          y += 44
          dr.rounded_rectangle([sp(pad), sp(y), sp(x2), sp(y+116)], radius=sp(16), fill=SURFACE, outline=DIMMER, width=sp(1.2))
          dr.text((sp(pad+28), sp(y+24)), 'WEEKEND MULTI', font=mono_b(15), fill=MUTED)
          dr.text((sp(pad+28), sp(y+62)), r['pending_note'], font=grotesk(22,500), fill=PAPER)
          dr.text((sp(x2-28), sp(y+48)), 'PENDING', font=mono_b(20), fill=MUTED, anchor='ra')
          fy = H - 110
          dr.line([(sp(pad), sp(fy)), (sp(W-pad), sp(fy))], fill=DIMMER, width=sp(1.5))
          dr.text((sp(pad), sp(fy+26)), '@puntmatenz', font=mono_b(20), fill=PAPER)
          dr.text((sp(W-pad), sp(fy+30)), 'For entertainment & informational purposes only · Not advice · 18+', font=mono_r(14), fill=MUTED, anchor='ra')
          img.resize((W,H), Image.LANCZOS).save(d/'recap_story.png')
          base = 'https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/main/'+str(d)+'/'
          m = {'pick_id': pid, 'post_date': local.date().isoformat(), 'kind': 'weekly_recap',
               'source_type': 'research_based', 'intended_platforms': ['telegram','instagram_story'],
               'story_url': base+'recap_story.png', 'telegram_caption': r['telegram_caption'],
               'week_label': r['week_label'], 'wins': wins, 'losses': losses,
               'evidence_urls': r['evidence_urls'], 'research_checked_at': now.isoformat()}
          (d/'post-metadata.json').write_text(json.dumps(m, indent=2))
          write_manifest(build_manifest(str(d), [f.name for f in d.iterdir() if f.name != 'manifest.json'], extra={'pick_id': pid, 'created_at': now.isoformat()}), str(d/'manifest.json'))
          print('Recap package frozen:', pid)
          PYRECAP
