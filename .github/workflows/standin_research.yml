      - name: Validate exact package before publish
        if: inputs.action == 'publish' || inputs.action == 'publish-multi'
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from manifest import load_manifest, verify_manifest
          now = datetime.now(timezone.utc)
          today = now.astimezone(ZoneInfo('Pacific/Auckland')).date().isoformat()
          assert today < '2026-11-01', 'Stand-in authorization window ended'
          pid = os.environ['PICK_ID']
          assert re.fullmatch(r'\d{4}-\d{2}-\d{2}_research_[A-Za-z0-9_]+',pid), 'Invalid research package ID'
          d = Path('data/review',pid)
          m = json.loads((d/'post-metadata.json').read_text())
          assert m['pick_id']==pid and m['post_date']==today
          assert m['source_type']=='research_based'
          if os.environ['ACTION'] == 'publish-multi':
              assert m.get('kind') == 'research_multi'
              assert pid == today + '_research_Weekend_Multi_full'
              assert m['intended_platforms']==['telegram','instagram_story']
          else:
              assert not m.get('kind')
              assert m['intended_platforms']==['telegram','instagram_feed','instagram_story'], 'Unexpected platform'
          assert datetime.fromisoformat(m['kickoff'].replace('Z','+00:00')) > now, 'Fixture already started'
          assert 0 <= (now-datetime.fromisoformat(m['research_checked_at'].replace('Z','+00:00'))).total_seconds() < 7200, 'Research stale'
          ok, errors = verify_manifest(load_manifest(str(d/'manifest.json')),str(d))
          assert ok, errors
          PY
      - name: Publish verified frozen files (or dry run)
        if: inputs.action == 'publish' || inputs.action == 'publish-multi'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          if [ "$ACTION" != "publish-multi" ]; then
            python scripts/publish_pick.py
          else
            python - <<'PYPUBLISH'
          import os
          import publish_pick as p
          original=p.publish
          def publish(review_dir,metadata,telegram_text,instagram_caption,results):
              import json, requests
              from pathlib import Path
              platforms=metadata.get('intended_platforms',[])
              if 'telegram' in platforms:
                  try:
                      import post_telegram as tg
                      with open(Path(review_dir)/'story.png','rb') as f1, open(Path(review_dir)/'story-breakdown.png','rb') as f2:
                          media=[{'type':'photo','media':'attach://first','caption':telegram_text},{'type':'photo','media':'attach://second'}]
                          r=requests.post('https://api.telegram.org/bot'+tg.BOT_TOKEN+'/sendMediaGroup',data={'chat_id':tg.CHANNEL_ID,'media':json.dumps(media)},files={'first':f1,'second':f2},timeout=40).json()
                      results['telegram']={'ok':bool(r.get('ok')),'detail':r}
                  except Exception as e:results['telegram']={'ok':False,'error':str(e)}
              for platform in ('instagram_story','facebook_story'):
                  if platform not in platforms:continue
                  if (platform=='instagram_story' and os.environ.get('META_READY')!='true') or (platform=='facebook_story' and os.environ.get('FACEBOOK_READY')!='true'):
                      results[platform]={'ok':False,'held':True,'note':'Awaiting Meta token repair'};continue
                  if platform=='facebook_story' and os.environ.get('FACEBOOK_APPROVED')!='true':
                      results[platform]={'ok':False,'held':True,'note':'Awaiting final Facebook Story photo approval'};continue
                  previous=p._prior_publish_record(metadata['pick_id']).get(platform,{})
                  done=list(previous.get('frames',[]))
                  for i,url in enumerate(metadata['story_urls']):
                      if i<len(done) and done[i].get('ok'):continue
                      try:
                          if platform=='instagram_story':
                              import post_instagram_story as mod
                              mid=mod.post_story_to_instagram(url)
                              result={'ok':mid is not None,'media_id':mid,'error':getattr(mod,'LAST_ERROR',None)}
                          else:
                              import post_facebook as mod
                              mid=mod.post_story(url);result={'ok':mid is not None,'story_id':mid}
                      except Exception as e:result={'ok':False,'error':str(e)}
                      if i<len(done):done[i]=result
                      else:done.append(result)
                      if not result['ok']:break
                  results[platform]={'ok':len(done)==2 and all(x.get('ok') for x in done),'frames':done}
          p.publish=publish
          p.main()
          PYPUBLISH
          fi
      - name: Publish weekly recap (or dry run)
        if: inputs.action == 'publish-recap'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          python - <<'PYPUBRECAP'
          import json, os, re, requests
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from manifest import load_manifest, verify_manifest
          now = datetime.now(timezone.utc)
          today = now.astimezone(ZoneInfo('Pacific/Auckland')).date().isoformat()
          assert today < '2026-11-01', 'Stand-in authorization window ended'
          pid = today + '_research_Weekly_Recap'
          d = Path('data/review', pid)
          m = json.loads((d/'post-metadata.json').read_text())
          assert m['pick_id'] == pid and m['post_date'] == today
          assert m.get('kind') == 'weekly_recap' and m['source_type'] == 'research_based'
          assert m['intended_platforms'] == ['telegram','instagram_story'], 'Unexpected platform'
          ok, errors = verify_manifest(load_manifest(str(d/'manifest.json')), str(d))
          assert ok, errors
          results = {}
          dry = os.environ.get('DRY_RUN','true').lower() == 'true'
          if dry:
              print('DRY RUN - would send Telegram photo + caption and IG story', m['story_url'])
              results = {'dry_run': True, 'telegram': {'ok': True, 'note': 'simulated'}, 'instagram_story': {'ok': True, 'note': 'simulated'}}
          else:
              token = os.environ['TELEGRAM_BOT_TOKEN']; chat = os.environ['TELEGRAM_CHANNEL_ID']
              try:
                  with open(d/'recap_story.png','rb') as f:
                      r = requests.post('https://api.telegram.org/bot'+token+'/sendPhoto',
                          data={'chat_id': chat, 'caption': m['telegram_caption']},
                          files={'photo': f}, timeout=40).json()
                  results['telegram'] = {'ok': bool(r.get('ok')), 'detail': r}
              except Exception as e:
                  results['telegram'] = {'ok': False, 'error': str(e)}
              if os.environ.get('META_READY') != 'true':
                  results['instagram_story'] = {'ok': False, 'held': True, 'note': 'Awaiting Meta token readiness confirmation'}
              else:
                  try:
                      import post_instagram_story as mod
                      mid = mod.post_story_to_instagram(m['story_url'])
                      results['instagram_story'] = {'ok': mid is not None, 'media_id': mid, 'error': getattr(mod, 'LAST_ERROR', None)}
                  except Exception as e:
                      results['instagram_story'] = {'ok': False, 'error': str(e)}
          out = Path('data/published', pid + '.json')
          if not dry:
              out.write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2)[:2000])
          if not dry and not (results.get('telegram',{}).get('ok') and results.get('instagram_story',{}).get('ok')):
              raise SystemExit('Recap publish incomplete - see results')
          PYPUBRECAP
      - name: Diagnose Meta token and account mapping (read-only)
        if: inputs.action == 'diagnose'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          python - <<'PYDIAG'
          import json, os, requests
          from pathlib import Path
          from datetime import datetime, timezone
          meta=os.environ.get('META_PAGE_TOKEN','')
          fb=os.environ.get('FACEBOOK_PAGE_TOKEN','')
          ig_id=os.environ.get('IG_USER_ID','')
          page_id=os.environ.get('FACEBOOK_PAGE_ID','')
          out={'checked_at':datetime.now(timezone.utc).isoformat()}
          G='https://graph.facebook.com/v21.0'
          def get(url, params):
              try:
                  r=requests.get(url, params=params, timeout=30)
                  return r.status_code, r.json()
              except Exception as e:
                  return None, {'exception': str(e)}
          for label, verifier in (('via_meta_token', meta), ('via_fb_token', fb)):
              if not verifier: continue
              st, d = get(G+'/debug_token', {'input_token': meta, 'access_token': verifier})
              data=(d or {}).get('data') if isinstance(d, dict) else None
              if data:
                  out['debug_token']={
                      'app_id': data.get('app_id'),
                      'type': data.get('type'),
                      'is_valid': data.get('is_valid'),
                      'expires_at': data.get('expires_at'),
                      'scopes': data.get('scopes'),
                      'profile_id': data.get('profile_id'),
                  }
                  out['debug_token_verifier']=label
                  break
              err=(d or {}).get('error',{}) if isinstance(d,dict) else {}
              out.setdefault('debug_token_attempts',{})[label]={'status':st,'error':err.get('message')}
          st, d = get(G+'/me', {'fields':'id,name', 'access_token': meta})
          err=(d or {}).get('error',{}) if isinstance(d,dict) else {}
          out['me']={'status':st,'id':(d or {}).get('id') if isinstance(d,dict) else None,'name':(d or {}).get('name') if isinstance(d,dict) else None,'error':err.get('message')}
          out['me_matches_facebook_page_id_secret'] = bool(out['me'].get('id')) and str(out['me'].get('id'))==str(page_id)
          st, d = get(G+'/'+str(ig_id), {'fields':'username,name', 'access_token': meta})
          err=(d or {}).get('error',{}) if isinstance(d,dict) else {}
          out['ig_lookup']={'status':st,'id':(d or {}).get('id') if isinstance(d,dict) else None,'username':(d or {}).get('username') if isinstance(d,dict) else None,'error':err.get('message')}
          st, d = get(G+'/me', {'fields':'instagram_business_account', 'access_token': meta})
          err=(d or {}).get('error',{}) if isinstance(d,dict) else {}
          iba=(d or {}).get('instagram_business_account',{}) if isinstance(d,dict) else {}
          iba=iba or {}
          out['page_linked_ig']={'status':st,'ig_id':iba.get('id'),'error':err.get('message')}
          if iba.get('id'):
              out['linked_ig_matches_ig_user_id_secret']= str(iba.get('id'))==str(ig_id)
          Path('data/state').mkdir(parents=True, exist_ok=True)
          Path('data/state/diagnostic_meta_token.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PYDIAG
