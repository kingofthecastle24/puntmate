name: PuntMate Stand-in Research
run-name: Stand-in ${{ inputs.action }} - ${{ inputs.pick_id || 'new research pick' }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a frozen package, or publish an inspected package
        type: choice
        options: [prepare, publish, prepare-multi, prepare-story, publish-multi]
        default: prepare
        required: true
      pick_json:
        description: Real researched pick JSON (prepare only; no secrets)
        type: string
        required: false
      pick_id:
        description: Exact frozen package ID (publish only)
        type: string
        required: false
      facebook_approved:
        description: Final Facebook Story photo reviewed and approved by Micah
        type: boolean
        default: false
      dry_run:
        description: Simulate publishing without sending any posts
        type: boolean
        default: true
concurrency:
  group: puntmate-social-pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  standin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      ACTION: ${{ inputs.action }}
      PICK_JSON: ${{ inputs.pick_json }}
      PICK_ID: ${{ inputs.pick_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      FACEBOOK_APPROVED: ${{ inputs.facebook_approved }}
      AUTO_PUBLISH: 'true'
      RESEND_FAILED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow playwright
      - if: inputs.action == 'prepare' || inputs.action == 'prepare-multi'
        run: playwright install --with-deps chromium
      - name: Validate and prepare research-only frozen package
        if: inputs.action == 'prepare'
        run: |
          python - <<'PY'
          import json, os, re, shutil
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import render_brand_templates as renderer
          from build_review_package import build_telegram_text, build_instagram_caption
          from copy_validator import validate_post
          from manifest import build_manifest, write_manifest
          from workflow_state import transition, GENERATED, PREVIEW_READY, AWAITING_APPROVAL
          now = datetime.now(timezone.utc)
          local = now.astimezone(ZoneInfo('Pacific/Auckland'))
          assert local.date().isoformat() < '2026-11-01', 'Stand-in authorization window ended'
          p = json.loads(os.environ['PICK_JSON'])
          required = ['match','sport','sport_label','market','selection','odds','kickoff','final_explanation','research_sources','odds_source_url','research_checked_at']
          assert all(p.get(k) for k in required), 'Missing required pick evidence'
          assert p.get('source_type') == 'research_based', 'Research source type required'
          assert not any(p.get(k) for k in ('synthetic','test','is_test','force_test_pick')), 'No synthetic picks'
          kickoff = datetime.fromisoformat(p['kickoff'].replace('Z','+00:00'))
          checked = datetime.fromisoformat(p['research_checked_at'].replace('Z','+00:00'))
          assert 0 < (kickoff-now).total_seconds() <= 86400, 'Fixture must be in next 24h'
          assert 0 <= (now-checked).total_seconds() < 7200, 'Research is stale'
          assert 1 < float(p['odds']) <= 2.2, 'Conservative odds required'
          assert len(p['research_sources']) >= 2 and all(s.startswith('https://') for s in p['research_sources'])
          assert p['odds_source_url'].startswith('https://')
          p.update(has_pick=True, bet_type='INVESTOR_BET', bet_type_label='Investor Bet', risk='STANDARD_PICK', confidence='High', confidence_label='High')
          p['bet_type_reason'] = p['final_explanation']
          date = local.date().isoformat()
          pick_id = date + '_research_' + renderer.slugify(p['match'])
          revision = p.get('revision', 1)
          assert isinstance(revision, int) and 1 <= revision <= 9
          if revision > 1:
              pick_id += '_v' + str(revision)
          assert not Path('data/review',pick_id).exists(), 'Frozen package already exists; inspect it or use its exact ID'
          def kickoff_display(iso):
              dt = datetime.fromisoformat(iso.replace('Z','+00:00')).astimezone(ZoneInfo('Pacific/Auckland'))
              return dt.strftime('%a %d %b').upper(), dt.strftime('%a %d %b, %-I:%M%p').lower() + ' NZDT'
          renderer.kickoff_display = kickoff_display
          original_build_props = renderer.build_props
          def standin_props(pick, handle='@puntmatenz'):
              props = original_build_props(pick, handle)
              # Template appends RISK to this prop; confidence remains in its own chip.
              props['confidenceLabel'] = 'LOW'
              return props
          renderer.build_props = standin_props
          result = renderer.render_pick(p, date_str=date)
          assert result['ok'], result
          p['render_warnings'] = result.get('warnings', [])
          review = Path('data/review',pick_id)
          review.mkdir(parents=True)
          for key, src in result['files'].items():
              shutil.copyfile(src,review/(key+'.png'))
          telegram, instagram = build_telegram_text(p), build_instagram_caption(p)
          validate_post({'risk':p['risk'],'bet_type':p['bet_type'],'classification':p['risk'],'selection':p['selection']},telegram,instagram)
          (review/'telegram-post.txt').write_text(telegram)
          (review/'instagram-caption.txt').write_text(instagram)
          # Public graphics stay in normal PuntMate style; provenance stays in metadata.
          meta = dict(p, pick_id=pick_id, post_date=date, generated_at=now.isoformat(), intended_platforms=['telegram','instagram_feed','instagram_story'], source_type='research_based', stake_guidance_nzd=10, workflow_state='AWAITING_APPROVAL')
          base = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/main/'
          # Normalize any absolute renderer paths before constructing public URLs.
          meta['carousel_urls'] = [base+str(Path(result['files'][k]).resolve().relative_to(Path.cwd())) for k in ('cover','tip','breakdown')]
          meta['story_url'] = base+str(Path(result['files']['story']).resolve().relative_to(Path.cwd()))
          (review/'post-metadata.json').write_text(json.dumps(meta,indent=2))
          names = [f.name for f in review.iterdir() if f.is_file()]
          write_manifest(build_manifest(str(review),names,extra={'pick_id':pick_id,'created_at':now.isoformat()}),str(review/'manifest.json'))
          for state in (GENERATED,PREVIEW_READY,AWAITING_APPROVAL):
              transition(os.getcwd(),pick_id,state,note='Research-based stand-in; visual review before live dispatch')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Prepared research-based package: '+pick_id+'\n\nInspect all four PNGs and captions before dispatching publish.\n')
          PY
      - name: Prepare one-off RLWC research multi
        if: inputs.action == 'prepare-multi'
        run: |
          python - <<'PYMULTI'
          import json, os, shutil
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from decimal import Decimal
          import render_brand_templates as renderer
          from copy_validator import validate_text
          from manifest import build_manifest, write_manifest
          from workflow_state import transition, GENERATED, PREVIEW_READY, AWAITING_APPROVAL
          now = datetime.now(timezone.utc)
          today = now.astimezone(ZoneInfo('Pacific/Auckland')).date().isoformat()
          p = json.loads(os.environ['PICK_JSON'])
          assert p['kind'] == 'rlwc_multi' and p['source_type'] == 'research_based'
          assert today == '2026-10-16', 'One-off multi only'
          assert len(p['legs']) == 3
          assert [x['selection'] for x in p['legs']] == ['Papua New Guinea','Tonga','Fiji']
          checked = datetime.fromisoformat(p['research_checked_at'].replace('Z','+00:00'))
          assert 0 <= (now-checked).total_seconds() < 7200
          for leg in p['legs']:
              dt = datetime.fromisoformat(leg['kickoff'].replace('Z','+00:00'))
              assert 0 < (dt-now).total_seconds() < 7*86400
              assert 1 < float(leg['odds']) < 3
          pid = today + '_research_RLWC_Weekend_Multi'
          assert not Path('data/review',pid).exists(), 'Frozen multi already exists'
          combined = Decimal('1')
          for leg in p['legs']: combined *= Decimal(str(leg['odds']))
          original = renderer.build_multi_props
          def props(legs,tier,handle='@puntmatenz'):
              x = original(legs,tier,handle)
              x.update(analysis=p['analysis'],combinedOdds='~'+format(combined,'.2f'),stake='$10',stakeReturn='All 3 legs must win',multiType='World Cup Multi',coverKicker='WORLD CUP WEEKEND MULTI',riskTagline='Tonga is the danger leg · All 3 must win · Indicative public odds')
              return x
          renderer.build_multi_props = props
          result = renderer.render_multi({'match':'RLWC Weekend Multi'},'punter',p['legs'],date_str=today)
          assert result['ok']
          d = Path('data/review',pid); d.mkdir(parents=True)
          for key,src in result['files'].items():
              shutil.copyfile(src,d/('tip.png' if key=='legs' else key+'.png'))
          text = p['caption']
          validate_text(text,risk='STANDARD_PICK',bet_type='PUNTER_BET',public=True)
          (d/'telegram-post.txt').write_text(text)
          (d/'instagram-caption.txt').write_text(text)
          base='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/main/'
          urls=[base+str(Path(result['files'][k]).resolve().relative_to(Path.cwd())) for k in ('cover','legs','breakdown')]
          meta=dict(p,has_pick=True,pick_id=pid,post_date=today,generated_at=now.isoformat(),kickoff=p['legs'][0]['kickoff'],match='RLWC Weekend Multi',selection='Papua New Guinea + Tonga + Fiji',odds=float(combined),market='Match winner multi',bet_type='PUNTER_BET',risk='STANDARD_PICK',confidence='Medium',confidence_label='Medium',carousel_urls=urls,intended_platforms=['telegram','instagram_feed','facebook'],render_warnings=result.get('warnings',[]),stake_guidance_nzd=10)
          (d/'post-metadata.json').write_text(json.dumps(meta,indent=2))
          write_manifest(build_manifest(str(d),[f.name for f in d.iterdir()],extra={'pick_id':pid,'created_at':now.isoformat()}),str(d/'manifest.json'))
          for state in (GENERATED,PREVIEW_READY,AWAITING_APPROVAL): transition(os.getcwd(),pid,state,note='One-off RLWC research multi; render review required')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Prepared '+pid+'; inspect all three PNGs before live publish.')
          PYMULTI
      - name: Prepare story-only multi revision
        if: inputs.action == 'prepare-story'
        run: |
          python - <<'PYSTORY'
          import json, os, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from manifest import build_manifest, write_manifest
          from workflow_state import transition, GENERATED, PREVIEW_READY, AWAITING_APPROVAL
          from datetime import datetime, timezone
          pid='2026-10-16_research_RLWC_Weekend_Multi_story'
          src=Path('data/review/2026-10-16_research_RLWC_Weekend_Multi')
          d=Path('data/review',pid)
          assert not d.exists()
          shutil.copytree(src,d)
          im=Image.new('RGB',(1080,1920),'#0b120f'); draw=ImageDraw.Draw(im)
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def text(y,s,size=32,color='#eaf7ef',b=False):
              f=ImageFont.truetype(bold if b else font,size);draw.text((80,y),s,font=f,fill=color)
          logo=Image.open('brand/Logo/puntmate-icon-badge.png').convert('RGBA').resize((112,112),Image.Resampling.LANCZOS)
          im.paste(logo,(70,190),logo)
          draw.text((205,218),'PUNTMATE NZ',font=ImageFont.truetype(bold,44),fill='#24df7a')
          text(315,'WORLD CUP WEEKEND MULTI',37,b=True)
          legs=Image.open(d/'tip.png').convert('RGB');legs.thumbnail((1080,1300));im.paste(legs,((1080-legs.width)//2,360))
          text(1695,'PNG: Sat 5:25pm   Tonga: Sat 10:05pm',27)
          text(1734,'Fiji: Sun 6:05pm  |  NZDT  |  17-18 Oct',27)
          text(1785,'Indicative PandaBet odds, not TAB. Odds may change.',23,'#8fa69a')
          text(1820,'All 3 must win. Tonga is the danger leg. 18+.',23,'#8fa69a')
          im.save(d/'story.png')
          shutil.copyfile(d/'story.png',d/'tip.png')
          m=json.loads((d/'post-metadata.json').read_text())
          m.update(pick_id=pid,intended_platforms=['telegram','instagram_story','facebook_story'],story_url='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/main/'+str(d/'story.png'))
          (d/'post-metadata.json').write_text(json.dumps(m,indent=2))
          write_manifest(build_manifest(str(d),[f.name for f in d.iterdir() if f.name!='manifest.json'],extra={'pick_id':pid,'created_at':datetime.now(timezone.utc).isoformat()}),str(d/'manifest.json'))
          for state in (GENERATED,PREVIEW_READY,AWAITING_APPROVAL):transition(os.getcwd(),pid,state,note='Story-only correction requested by Micah; inspect actual story PNG')
          PYSTORY
      - name: Commit only stand-in packages, cards and state
        if: inputs.action == 'prepare' || inputs.action == 'prepare-multi' || inputs.action == 'prepare-story'
        run: |
          git config user.name 'PuntMate Bot'
          git config user.email 'puntmatenz@gmail.com'
          git add data/review/*_research_* data/state/*_research_*.json data/cards/
          git diff --cached --quiet || git commit -m 'chore: freeze stand-in research package [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Validate exact package before publish
        if: inputs.action == 'publish' || inputs.action == 'publish-multi'
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from manifest import load_manifest, verify_manifest
          now = datetime.now(timezone.utc)
          today = now.astimezone(ZoneInfo('Pacific/Auckland')).date().isoformat()
          assert today < '2026-11-01', 'Stand-in authorization window ended'
          pid = os.environ['PICK_ID']
          assert re.fullmatch(r'\d{4}-\d{2}-\d{2}_research_[A-Za-z0-9_]+',pid), 'Invalid research package ID'
          d = Path('data/review',pid)
          m = json.loads((d/'post-metadata.json').read_text())
          assert m['pick_id']==pid and m['post_date']==today
          assert m['source_type']=='research_based'
          if os.environ['ACTION'] == 'publish-multi':
              assert m.get('kind') == 'rlwc_multi' and today == '2026-10-16'
              assert pid == '2026-10-16_research_RLWC_Weekend_Multi_story'
              assert m['intended_platforms']==['telegram','instagram_story','facebook_story']
          else:
              assert not m.get('kind')
              assert m['intended_platforms']==['telegram','instagram_feed','instagram_story'], 'Unexpected platform'
          assert datetime.fromisoformat(m['kickoff'].replace('Z','+00:00')) > now, 'Fixture already started'
          assert 0 <= (now-datetime.fromisoformat(m['research_checked_at'].replace('Z','+00:00'))).total_seconds() < 7200, 'Research stale'
          ok, errors = verify_manifest(load_manifest(str(d/'manifest.json')),str(d))
          assert ok, errors
          PY
      - name: Publish verified frozen files (or dry run)
        if: inputs.action == 'publish' || inputs.action == 'publish-multi'
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          if [ "$ACTION" != "publish-multi" ]; then
            python scripts/publish_pick.py
          else
            python - <<'PYPUBLISH'
          import os
          import publish_pick as p
          original=p.publish
          def publish(review_dir,metadata,telegram_text,instagram_caption,results):
              platforms=metadata.get('intended_platforms',[])
              original(review_dir,{**metadata,'intended_platforms':[x for x in platforms if x!='facebook_story']},telegram_text,instagram_caption,results)
              if 'facebook_story' in platforms:
                  if os.environ.get('FACEBOOK_APPROVED')!='true':
                      results['facebook_story']={'skipped':True,'note':'Awaiting final Facebook Story photo approval'}
                  else:
                      try:
                          import post_facebook
                          sid=post_facebook.post_story(metadata['story_url'])
                          results['facebook_story']={'ok':sid is not None,'story_id':sid}
                      except Exception as e:results['facebook_story']={'ok':False,'error':str(e)}
          p.publish=publish
          p.main()
          PYPUBLISH
          fi
      - name: Persist platform receipts and state
        if: always() && (inputs.action == 'publish' || inputs.action == 'publish-multi') && inputs.dry_run == false
        run: |
          git config user.name 'PuntMate Bot'
          git config user.email 'puntmatenz@gmail.com'
          git add data/published/*_research_*.json data/state/*_research_*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'chore: record stand-in publish results [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standin-research-evidence
          path: |
            data/review/*_research_*/
            data/published/*_research_*.json
            data/state/*_research_*.json
