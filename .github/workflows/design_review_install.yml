name: Install mandatory design review gate
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install fail-closed guard without publishing
        run: |
          python - <<'PYFILES'
          import json,base64
          from pathlib import Path
          files=json.loads('{"DESIGN_REVIEW.md": "", "scripts/design_review_gate.py": "", "config/public_delivery.json": ""}')
          for name,data in files.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(data))
          PYFILES
          if python scripts/design_review_gate.py; then exit 1; fi
          git config user.name 'PuntMate Bot'
          git config user.email 'puntmatenz@gmail.com'
          git add DESIGN_REVIEW.md scripts/design_review_gate.py config/public_delivery.json
          git commit -m 'Require current-style final-pixel review before all graphic sends [skip ci]'
          git push
