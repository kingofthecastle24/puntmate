name: PuntMate Check Results

on:
  schedule:
    # 11pm NZT daily (NZT is UTC+12, so 11am UTC)
    # Runs ~15hrs after morning picks — enough time for most games to finish
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Allow manual trigger for testing

jobs:
  check_results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve pending picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd scripts
          python check_results.py

      - name: Update challenge ledger
        run: |
          cd scripts
          python challenge_tracker.py

      - name: Post results to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          cd scripts
          python post_results_telegram.py

      - name: Commit resolved picks
        run: |
          git add data/picks.json config/challenge.json
          # ledger only exists once the challenge has been enabled + run
          [ -f data/challenge.json ] && git add data/challenge.json || true
          # 2026-10-15 redesign: check_results.py now reserves SCORES credits
          # from the same durable quota_budget.json generate.yml's odds calls
          # use — must be committed here too, or the SCORES side of the
          # budget resets to "fresh" every run instead of tracking spend
          # across the month. git_push_retry.sh's rebase-retry already
          # handles the rare case where generate.yml commits to the same
          # file around the same time (see quota_budget.py's own docstring).
          git add data/quota_budget.json 2>/dev/null || true
          bash scripts/git_push_retry.sh "chore: resolve picks $(date -u +%Y-%m-%d) [skip ci]" --soft

      - name: Log run summary
        if: always()
        run: echo "Results check completed at $(date -u)"
