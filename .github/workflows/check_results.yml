name: PuntMate Check Results

on:
  schedule:
    # 11pm NZT daily (NZT is UTC+12, so 11am UTC)
    # Runs ~15hrs after morning picks — enough time for most games to finish
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Allow manual trigger for testing

concurrency:
  group: puntmate-social-pipeline
  cancel-in-progress: false

jobs:
  check_results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - run: python -m playwright install chromium --with-deps

      - name: Resolve pending picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd scripts
          python check_results.py

      - name: Update challenge ledger
        run: |
          cd scripts
          python challenge_tracker.py

      - name: Settle canonical public selections against strict source scores
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -c "import base64; from pathlib import Path; Path('scripts/register_public_pick.py').write_bytes(base64.b64decode(''))"
          python scripts/register_public_pick.py
          python scripts/settle_public_ledger.py

      - name: Deliver newly verified public results (config-gated)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          if python -c "import json; assert json.load(open('config/public_delivery.json')).get('results_enabled')"; then
            python scripts/public_delivery.py results --send
          else
            python scripts/public_delivery.py results
          fi

      - name: Commit resolved picks
        run: |
          git add data/picks.json config/challenge.json data/results/picks_ledger.json
          [ ! -d data/results/evidence ] || git add data/results/evidence
          [ ! -f data/state/public_delivery.json ] || git add data/state/public_delivery.json
          # ledger only exists once the challenge has been enabled + run
          [ -f data/challenge.json ] && git add data/challenge.json || true
          [ -f data/state/results_post_state.json ] && git add data/state/results_post_state.json || true
          bash scripts/git_push_retry.sh "chore: resolve picks $(date -u +%Y-%m-%d) [skip ci]" --soft

      - name: Log run summary
        if: always()
        run: echo "Results check completed at $(date -u)"
