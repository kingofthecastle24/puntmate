name: PuntMate Approved News Story
run-name: Approved RLWC news Story - ${{ inputs.send && 'LIVE' || 'DRY RUN' }}
on:
  workflow_dispatch:
    inputs:
      send:
        type: boolean
        default: false
        description: Publish exact inspected original Story to Instagram only
permissions:
  contents: write
concurrency:
  group: puntmate-social-pipeline
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Validate exact artwork and current fixture source then publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          SEND: ${{ inputs.send }}
          PYTHONPATH: scripts
        run: |
          python - <<'PYNEWS'
          import base64,hashlib,json,os,requests
          from datetime import datetime,timezone
          from pathlib import Path
          # Exact artwork inspected by main at 17:27 NZDT 6 Nov. No music/feed/FB.
          # Fixture source read at18:01; NZRL sold-out post re-read at18:05.
          # Fixed short authorization freshness window, not a reusable timestamp override.
          now=datetime.now(timezone.utc)
          assert now < datetime.fromisoformat('2026-11-06T06:00:00+00:00'), 'News evidence expired; recheck sources and artwork before a new release'
          source='https://www.nrl.com/news/2026/11/01/rugby-league-world-cup-2026-semi-finals-confirmed/'
          html=requests.get(source,timeout=30);html.raise_for_status()
          for claim in ('Samoa','Allianz','November 8','8.05pm','Newcastle'):
              assert claim in html.text, 'Fixture source no longer matches inspected facts'
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='71d50d0d160c207ec9645a61b867373cc38e8b294401e4198ccf3d329cd0c39f'
          path=Path('/tmp/approved-news.png');path.write_bytes(data)
          receipt=Path('data/state/news-2026-11-06-semis.json')
          if receipt.exists():raise SystemExit('Already attempted: inspect receipt/live Story, do not duplicate')
          if os.environ.get('SEND')!='true':
              print('DRY RUN: exact approved original news artwork validated; Instagram Story only')
          else:
              receipt.parent.mkdir(parents=True,exist_ok=True)
              receipt.write_text(json.dumps({'status':'attempting','at':now.isoformat()}))
              from post_instagram_story import upload_to_catbox,post_story_to_instagram
              mid=post_story_to_instagram(upload_to_catbox(str(path)))
              if not mid:raise SystemExit('Story failed or ambiguous: inspect before retry')
              receipt.write_text(json.dumps({'status':'sent','media_id':mid,'at':now.isoformat(),'fixture_source':source,'sold_out_source':'https://www.instagram.com/nzrugbyleague/p/DfWgi5aTAwn/'},indent=2))
              print('Published IG Story',mid)
          PYNEWS
      - name: Save attempt receipt even on failure
        if: always() && inputs.send
        run: |
          git add data/state/news-2026-11-06-semis.json || true
          bash scripts/git_push_retry.sh 'chore: news Story receipt [skip ci]'
